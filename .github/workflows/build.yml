name: Compiler l'APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optionnel : télécharge un zip contenant les binaires QEMU (libqemu-*.so à la racine du zip).
      # À définir dans GitHub : Settings > Secrets and variables > Actions > Variables > QEMU_URL
      - name: Télécharger les binaires QEMU (optionnel)
        env:
          QEMU_URL: ${{ vars.QEMU_URL }}
        run: |
          if [ -n "$QEMU_URL" ]; then
            curl -fsSL "$QEMU_URL" -o qemu.zip
            mkdir -p app/src/main/jniLibs/arm64-v8a
            unzip -o qemu.zip -d app/src/main/jniLibs/arm64-v8a
          fi
          ls -la app/src/main/jniLibs/arm64-v8a || true

      - name: Compiler
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VMDroid-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier une release (si tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
